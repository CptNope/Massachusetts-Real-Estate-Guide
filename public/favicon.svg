<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad)"/>
  
  <!-- House icon -->
  <g fill="white">
    <!-- Roof -->
    <path d="M 25 45 L 50 25 L 75 45 L 70 45 L 70 50 L 30 50 L 30 45 Z"/>
    
    <!-- House body -->
    <rect x="30" y="50" width="40" height="30" rx="2"/>
    
    <!-- Door -->
    <rect x="43" y="60" width="14" height="20" fill="#0ea5e9"/>
    
    <!-- Windows -->
    <rect x="35" y="55" width="8" height="8" fill="#0ea5e9"/>
    <rect x="57" y="55" width="8" height="8" fill="#0ea5e9"/>
  </g>
</svg>
